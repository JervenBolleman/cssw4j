# Runs cssw4j's benchmarks on x86-64 and on AArch64 hosted runners, and compares a commit with a reference commit in
# the same job, to judge performance changes on both architectures.
#
# Per architecture (.github/scripts/run-benchmarks.sh), interleaved over BENCH_ROUNDS rounds, each round running every
# variant (the VARIANTS input: label=JVM options after --add-modules jdk.incubator.vector) for the code and then the
# reference:
# 1. The dataset benchmark (swiss.sib.cssw4j.Benchmark): the protein test set all against all with the library's real
#    aligner, scores only and with CIGAR, in GCUPS on one thread, with a checksum of the scores.
# 2. The JMH benchmarks (the BENCHMARK input, default all). Most of them compare design alternatives in their own code
#    (see each class's comment); CpuBalancedBench runs the real aligner.
# A variant whose options this JVM rejects (-XX:UseAVX=2 on AArch64) is skipped on that machine and listed as skipped.
# The code measured is the CODE input (a branch, tag or commit; default the ref the workflow runs from). With a
# REFERENCE (for a push to main, main before the push), that cssw4j is built too and run in the same rounds: runners
# differ from run to run (CPU model, AVX-512 or not, neighbours), so code is compared within one job.
# The scripts come from the workflow's own commit, so CODE and REFERENCE can be any commit, also older than them.
#
# The report: each job's sections and machine (CPU model and the JVM's UseAVX/UseSVE/MaxVectorSize included) go to
# its step summary and to report/ (the report-<arch> artifact); the report job builds an HTML page from them
# (.github/scripts/report.py), adds it to the reports branch as runs/<run id>/ with an index of all runs, and deploys
# that branch to GitHub Pages.
#
# Hosted runners are virtual machines: wall times are noisy, so compare the code with the reference within one job,
# and GCUPS across runs only on the same CPU model. ARM runners are free for public repositories only.
name: Architecture comparison

on:
  # On main with the default inputs, to build up a series of runs on the runners' varying CPUs: once on weekdays, five
  # times on Saturdays and Sundays, when GitHub's runners are less loaded (UTC; blastp4j's runs are at other hours).
  schedule:
    - cron: "41 3 * * 1-5"
    - cron: "41 3,8,13,18,23 * * 0,6"
  # Each push to main, compared with main before the push.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      variants:
        description: "Benchmark variants, label=JVM options after --add-modules jdk.incubator.vector, separated by ; (variants the JVM rejects are skipped)"
        default: "default=;avx2=-XX:UseAVX=2;128bit=-Dcssw4j.vectorBits=128"
      bench_rounds:
        description: Benchmark rounds, the variants interleaved in each
        default: "1"
      code:
        description: cssw4j branch, tag or commit (full 40-character SHA) to measure; empty for the workflow's ref
        default: ""
      reference:
        description: cssw4j branch, tag or commit (full 40-character SHA) to compare with in the same job; empty for none
        default: ""
      benchmark:
        description: JMH benchmarks (a regular expression); . for all
        default: "."
      bench_args:
        description: "Further JMH arguments, such as -f 1 -wi 2 -i 5 (default: each benchmark's own)"
        default: ""
      dataset_args:
        description: "Arguments of the dataset benchmark: rounds, gap open, gap extend"
        default: "20 10 2"

permissions:
  contents: read

env:
  # The inputs, with their defaults for the scheduled and push runs, which have no inputs.
  VARIANTS: ${{ inputs.variants || 'default=;avx2=-XX:UseAVX=2;128bit=-Dcssw4j.vectorBits=128' }}
  BENCH_ROUNDS: ${{ inputs.bench_rounds || '1' }}
  BENCHMARK: ${{ inputs.benchmark || '.' }}
  BENCH_ARGS: ${{ inputs.bench_args }}
  DATASET_ARGS: ${{ inputs.dataset_args || '20 10 2' }}
  # The reference: the input, or for a push the commit main pointed to before it.
  REFERENCE: ${{ inputs.reference || (github.event_name == 'push' && github.event.before) || '' }}
  JAVA_VERSION: "27"

jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    env:
      REPORT: ${{ github.workspace }}/report
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
          path: ci
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.code }}
          path: code
      - uses: actions/checkout@v7
        if: env.REFERENCE
        with:
          ref: ${{ env.REFERENCE }}
          path: reference
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: code/pom.xml

      - name: Machine
        run: |
          mkdir -p "$REPORT"
          {
            echo "Architecture: $(uname -m)"
            echo "CPU model: $(lscpu | sed -n 's/^Model name: *//p' | head -1)"
            echo "Vendor: $(lscpu | sed -n 's/^Vendor ID: *//p' | head -1)"
            echo "CPUs: $(nproc)"
            echo "Memory: $(free -g | awk '/^Mem:/ { print $2 " GB" }')"
            echo "Kernel: $(uname -r)"
            echo "Runner: ${{ matrix.runner }}, image $ImageOS $ImageVersion"
            echo "JDK: $(java -version 2>&1 | sed -n 2p)"
            # What C2 vectorizes with here: AVX level or SVE, and the widest vector (bytes).
            echo "JVM vectors: $(java -XX:+PrintFlagsFinal -version 2>/dev/null |
              awk '$2 ~ /^(UseAVX|UseSVE|MaxVectorSize)$/ { printf "%s%s=%s", s, $2, $4; s = " " }')"
            echo "Code: \`$(git -C code rev-parse --short HEAD)\` ($(git -C code log -1 --format=%s | cut -c1-100))"
            if [ -d reference ]; then
              echo "Reference: \`$(git -C reference rev-parse --short HEAD)\` ($(git -C reference log -1 --format=%s | cut -c1-100))"
            fi
          } >"$REPORT/machine.txt"
          {
            echo "## $(uname -m) on ${{ matrix.runner }}"
            echo
            echo '```'
            cat "$REPORT/machine.txt"
            lscpu | grep -E 'Flags' | cut -c1-200
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Build
        run: |
          for tree in code reference; do
            [ -d "$tree" ] || continue
            mvn -B -q -f "$tree/pom.xml" test-compile
            mvn -B -q -f "$tree/pom.xml" dependency:build-classpath -Dmdep.outputFile="$PWD/$tree/target/cp.txt"
          done

      - name: Benchmark
        run: |
          trees=(code)
          [ -d reference ] && trees+=(reference)
          ci/.github/scripts/run-benchmarks.sh bench "${trees[@]}" | tee -a "$GITHUB_STEP_SUMMARY" "$REPORT/report.md"
          mkdir -p "$REPORT/jmh"
          cp bench/dataset.tsv "$REPORT/"
          cp bench/jmh-*.csv "$REPORT/jmh/" 2>/dev/null || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-${{ runner.arch }}
          path: bench
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: report-${{ runner.arch }}
          path: report

  report:
    needs: compare
    if: always()
    runs-on: ubuntu-24.04
    # One at a time: each run adds its report to the reports branch.
    concurrency:
      group: reports
      cancel-in-progress: false
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
          path: code
      - uses: actions/download-artifact@v8
        with:
          pattern: report-*
          path: reports
      # The reports branch holds every run's report (runs/<run id>/) and the index; it is created on the first run.
      - name: Reports branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="https://x-access-token:$GH_TOKEN@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$url" reports >/dev/null; then
            git clone -q --depth 1 --branch reports "$url" site
          else
            git init -q -b reports site
            git -C site remote add origin "$url"
          fi
      - name: Build the pages
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_EVENT: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          python3 code/.github/scripts/report.py run "site/runs/$RUN_ID" reports/*
          python3 code/.github/scripts/report.py index site
      - name: Push the reports branch
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Report of run ${{ github.run_id }} ($(git -C ../code rev-parse --short HEAD))"
          git push -q origin reports
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
